# Staging overrides for App Hosting backend Environment name = "staging".
#
# Merged over apphosting.yaml at build time. Non-secret Firebase web identifiers
# are committed here so the Vite client never falls back to guardentra-7f582.
# VITE_FIREBASE_API_KEY remains a Secret Manager reference (per-project value).
#
# Operator prerequisite (do not skip): set the guardentra-staging App Hosting
# backend Environment name to exactly "staging". Until that is set, only
# apphosting.yaml applies and these BUILD vars are ignored.
#
# Direct VPC egress (staging only) for private ClamAV.
# Operator-verified: App Hosting → ClamAV private TCP/3310 is REACHABLE
# (connectivity test guardentra-staging-clamav-3310 → 10.128.0.2:3310).
# EVIDENCE_SCANNER_SECRET: Secret Manager injected (revision
# guardentra-staging-build-2026-09-12-002); symbolic reference only.
# Manual authenticated GuardEntra → ClamAV validation PASSED (Action #8E):
#   clean → clean/clamav/clean; EICAR → quarantined/clamav/infected;
#   generation binding / stale_generation protection passed.
# EVIDENCE_SCANNER_ENABLED: ENABLED for STAGING E2E validation only.
# Enabling this flag does not establish durable event delivery.
# Eventarc / durable background triggering is NOT configured yet.
# Production remains disabled / unchanged.

runConfig:
  vpcAccess:
    egress: PRIVATE_RANGES_ONLY
    networkInterfaces:
      - network: default
        subnetwork: default

env:
  - variable: APP_ENV
    value: staging
    availability:
      - RUNTIME

  - variable: GCLOUD_PROJECT
    value: guardentra-staging
    availability:
      - RUNTIME

  - variable: GOOGLE_CLOUD_PROJECT
    value: guardentra-staging
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: guardentra-staging.firebasestorage.app
    availability:
      - RUNTIME

  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    value: guardentra-staging
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: guardentra-staging.firebaseapp.com
    availability:
      - BUILD

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: guardentra-staging.firebasestorage.app
    availability:
      - BUILD

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "965959469996"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    value: "1:965959469996:web:25526a3a432460c6ef0809"
    availability:
      - BUILD

  # Authoritative evidence scanner (docs/EVIDENCE_SCANNER.md) — STAGING ONLY.
  # Private App Hosting → ClamAV TCP/3310: proven REACHABLE.
  # EVIDENCE_SCANNER_SECRET: Secret Manager reference (LIVE on build-2026-09-12-002).
  # Manual authenticated scan proof PASSED (Action #8E).
  # EVIDENCE_SCANNER_ENABLED: on for staging E2E validation of post-validate enqueue.
  # Eventarc durable triggering: NOT configured. Production: unchanged.
  - variable: EVIDENCE_SCANNER_ENABLED
    value: "true"
    availability:
      - RUNTIME

  - variable: EVIDENCE_SCANNER_SECRET
    secret: EVIDENCE_SCANNER_SECRET
    availability:
      - RUNTIME

  - variable: CLAMAV_HOST
    value: "10.128.0.2"
    availability:
      - RUNTIME

  - variable: CLAMAV_PORT
    value: "3310"
    availability:
      - RUNTIME
