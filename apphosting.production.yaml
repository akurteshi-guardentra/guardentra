# Preferred production overrides when Environment name = "production".
#
# Live backend currently uses Environment name "prod" (see apphosting.prod.yaml).
# After an owner renames the App Hosting Environment to "production", this file
# applies instead. Content must stay identical to apphosting.prod.yaml.

env:
  - variable: APP_ENV
    value: production
    availability:
      - RUNTIME

  - variable: GCLOUD_PROJECT
    value: guardentra-prod
    availability:
      - RUNTIME

  - variable: GOOGLE_CLOUD_PROJECT
    value: guardentra-prod
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: guardentra-prod.firebasestorage.app
    availability:
      - RUNTIME

  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    value: guardentra-prod
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: guardentra-prod.firebaseapp.com
    availability:
      - BUILD

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: guardentra-prod.firebasestorage.app
    availability:
      - BUILD

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "191663365586"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    value: "1:191663365586:web:617ac1e2eeacc65d88bc0b"
    availability:
      - BUILD
