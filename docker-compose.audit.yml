services:
  audit-postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: guardentra_audit
      POSTGRES_USER: audit_migrator
      POSTGRES_PASSWORD: audit_migrator
    volumes:
      - guardentra_audit_pg:/var/lib/postgresql/data
      - ./migrations/audit/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_migrator -d guardentra_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guardentra_audit_pg:
