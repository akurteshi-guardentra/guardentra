name: infra-ci

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'migrations/audit/**'
      - 'scripts/audit-tests/**'
      - 'scripts/audit-managed-staging/**'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'migrations/audit/**'
      - 'scripts/audit-tests/**'
      - 'scripts/audit-managed-staging/**'
      - '.github/workflows/infra-ci.yml'

# P0 #136: routine repository CI must remain cloud-neutral. Live Terraform
# plan/apply requires a fresh issue-bound packet after #116 cloud inventory.
permissions:
  contents: read

jobs:
  static-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [envs/eu-staging, envs/named-staging, bootstrap/named-staging-state, bootstrap/isolated-staging-state, bootstrap/staging-audit-ops]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.8'

      - name: Terraform format check
        run: terraform fmt -check -recursive infra

      - name: Terraform init without remote backend
        working-directory: infra/${{ matrix.root }}
        run: |
          if [ '${{ matrix.root }}' != 'envs/eu-staging' ]; then
            terraform init -backend=false -input=false -lockfile=readonly
          else
            terraform init -backend=false -input=false
          fi

      - name: Terraform validate
        working-directory: infra/${{ matrix.root }}
        run: terraform validate

      - name: Terraform mocked security guardrails
        if: matrix.root == 'bootstrap/isolated-staging-state' || matrix.root == 'envs/named-staging' || matrix.root == 'bootstrap/staging-audit-ops'
        working-directory: infra/${{ matrix.root }}
        run: terraform test -no-color

      - name: Live execution quarantine
        run: |
          echo "P0 #136: routine CI performs no cloud auth, remote plan, apply, or force-unlock."
          echo "Use #116 read-only inventory plus a fresh environment-bound execution packet for live Terraform work."

  audit-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guardentra_audit_ci
          # Disposable job-local database only. No real passwords or cloud credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guardentra_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: guardentra_audit_ci
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply, repeat, and verify audit migration privileges on PostgreSQL 16
        run: bash scripts/audit-tests/run-migrations.sh

  audit-bootstrap-prerequisites:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guardentra_audit_bootstrap_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guardentra_audit_bootstrap_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: guardentra_audit_bootstrap_ci
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        working-directory: scripts/audit-managed-staging
        run: npm ci --ignore-scripts
      - name: Real PostgreSQL 16 non-superuser bootstrap and rollback checks
        working-directory: scripts/audit-managed-staging
        run: npm run test:bootstrap

  managed-audit-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: guardentra_audit_runner_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guardentra_audit_runner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: guardentra_audit_runner_ci
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated runner dependencies
        working-directory: scripts/audit-managed-staging
        run: npm ci --ignore-scripts
      - name: Managed staging scope and migration manifest guardrails
        working-directory: scripts/audit-managed-staging
        run: npm test
      - name: Real PostgreSQL 16 restricted migration and negative privilege tests
        working-directory: scripts/audit-managed-staging
        run: npm run test:postgres
