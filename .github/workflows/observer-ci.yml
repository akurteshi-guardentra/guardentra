name: Observer CI

on:
  pull_request:
    paths:
      - 'scripts/guardentra.ps1'
      - 'scripts/guardentra/ProviderProcesses.ps1'
      - 'scripts/guardentra/Supervisor.ps1'
      - 'scripts/guardentra/Observe-LocalAgents.ps1'
      - 'scripts/guardentra/Run-LocalSupervisor.ps1'
      - 'scripts/guardentra/Register-LocalRunnerTask.ps1'
      - 'scripts/guardentra/tests/Observer.Tests.ps1'
      - 'scripts/guardentra/tests/Runner.Tests.ps1'
      - 'scripts/guardentra/tests/Supervisor.Tests.ps1'
      - '.vscode/tasks.json'
      - 'docs/agent-ops/orchestration/LOCAL_AGENT_OBSERVER.md'
      - '.github/workflows/observer-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/guardentra.ps1'
      - 'scripts/guardentra/ProviderProcesses.ps1'
      - 'scripts/guardentra/Supervisor.ps1'
      - 'scripts/guardentra/Observe-LocalAgents.ps1'
      - 'scripts/guardentra/Run-LocalSupervisor.ps1'
      - 'scripts/guardentra/Register-LocalRunnerTask.ps1'
      - 'scripts/guardentra/tests/Observer.Tests.ps1'
      - 'scripts/guardentra/tests/Runner.Tests.ps1'
      - 'scripts/guardentra/tests/Supervisor.Tests.ps1'
      - '.vscode/tasks.json'
      - 'docs/agent-ops/orchestration/LOCAL_AGENT_OBSERVER.md'
      - '.github/workflows/observer-ci.yml'

jobs:
  windows-observer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: GuardEntra observer PowerShell 5.1 tests
        shell: powershell
        run: .\scripts\guardentra\tests\Observer.Tests.ps1
      - name: GuardEntra persistent runner/checkpoint tests
        shell: powershell
        run: .\scripts\guardentra\tests\Runner.Tests.ps1
