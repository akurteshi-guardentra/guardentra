# Production overrides for App Hosting backend Environment name = "prod".
#
# Live backend guardentra-prod currently uses Environment name "prod" (verified
# read-only 2026-09-07). Preferred rename to "production" + apphosting.production.yaml
# is an owner console step — do not silently mutate the backend.
#
# Identifiers verified from Firebase web app "GuardEntra Production Web".
# VITE_FIREBASE_API_KEY remains a Secret Manager reference.

env:
  - variable: APP_ENV
    value: production
    availability:
      - RUNTIME

  - variable: GCLOUD_PROJECT
    value: guardentra-prod
    availability:
      - RUNTIME

  - variable: GOOGLE_CLOUD_PROJECT
    value: guardentra-prod
    availability:
      - RUNTIME

  - variable: FIREBASE_STORAGE_BUCKET
    value: guardentra-prod.firebasestorage.app
    availability:
      - RUNTIME

  # Canonical public origin (env-fixes E1). Used for invitation/reminder links
  # (server/routes/notify.ts), the /api CORS allowlist and security.txt
  # (server/middleware/edgeSecurity.ts), and Stripe redirects. Production refuses
  # to guess when this is unset. guardentra.com is what prod serves today;
  # www.guardentra.com 301s to it. Owner confirms the origin before promotion.
  - variable: PUBLIC_APP_URL
    value: https://guardentra.com
    availability:
      - RUNTIME

  - variable: VITE_FIREBASE_API_KEY
    secret: VITE_FIREBASE_API_KEY
    availability:
      - BUILD

  - variable: VITE_FIREBASE_PROJECT_ID
    value: guardentra-prod
    availability:
      - BUILD

  - variable: VITE_FIREBASE_AUTH_DOMAIN
    value: guardentra-prod.firebaseapp.com
    availability:
      - BUILD

  - variable: VITE_FIREBASE_STORAGE_BUCKET
    value: guardentra-prod.firebasestorage.app
    availability:
      - BUILD

  - variable: VITE_FIREBASE_MESSAGING_SENDER_ID
    value: "191663365586"
    availability:
      - BUILD

  - variable: VITE_FIREBASE_APP_ID
    value: "1:191663365586:web:617ac1e2eeacc65d88bc0b"
    availability:
      - BUILD

  # Authoritative evidence scanner — enable after ClamAV + secret exist (docs/EVIDENCE_SCANNER.md).
